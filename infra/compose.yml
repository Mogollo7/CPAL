# PostgreSQL local para desarrollo (npm run bd:subir). Solo local: la clave de abajo no es de producción.
services:
  db:
    image: postgres:17-alpine
    container_name: capl-db
    environment:
      POSTGRES_USER: capl
      POSTGRES_PASSWORD: capl_local
      POSTGRES_DB: capl
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - capl_datos:/var/lib/postgresql/data
      - ./bd/init.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro # crea capl_app y capl_migrador (solo en volumen nuevo)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capl"]
      interval: 3s
      retries: 20
  # Túnel de Cloudflare: muestra tu app local (puerto 3000) en una dirección pública, para probar y trabajar juntos.
  # Solo arranca con `npm run tunel` (perfil "tunel"). El token va en .env (CLOUDFLARE_TUNNEL_TOKEN), nunca en git.
  # En el panel de Cloudflare, el "Public hostname" del túnel debe apuntar a: http://host.docker.internal:3000
  tunel:
    profiles: ["tunel"]
    image: cloudflare/cloudflared:latest
    container_name: capl-tunel
    command: tunnel --no-autoupdate run
    environment:
      # Sin `:?`: esa comprobación hacía fallar también `npm run bd:subir` a quien no usa el túnel. Si falta, cloudflared avisa al arrancar.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway" # en Linux; Docker Desktop (Windows/Mac) ya lo trae
    restart: unless-stopped
volumes:
  capl_datos:
