# Entorno de pruebas y de producción (E07). Cada entorno es un proyecto de Compose aparte, con su propio infra/.env:
#   VERSION=<commit> docker compose -p capl-pruebas -f compose.produccion.yml -f compose.servicios.yml up -d
# El flujo .github/workflows/desplegar.yml publica las imágenes y ejecuta ese comando por SSH.
# Variables que debe tener infra/.env además de las de .env.example:
#   DOMINIO, POSTGRES_PASSWORD, y DATABASE_URL / DATABASE_URL_MIGRADOR apuntando a `db:5432`.
# NO probado en un servidor real: revisar en el primer despliegue (ver infra/README.md).
services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: capl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en infra/.env}
      POSTGRES_DB: capl
      CAPL_APP_PASSWORD: ${CAPL_APP_PASSWORD:-}
      CAPL_MIGRADOR_PASSWORD: ${CAPL_MIGRADOR_PASSWORD:-}
    volumes:
      - datos_db:/var/lib/postgresql/data
      - ./bd/init-produccion.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ./bd/init.sql:/opt/capl/permisos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capl"]
      interval: 5s
      retries: 20
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  # Aplica las migraciones pendientes y termina. Si falla, la app nueva no arranca y la anterior sigue sirviendo.
  migrar:
    image: ghcr.io/mogollo7/cpal:${VERSION:-pruebas}-migrador
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL_MIGRADOR: ${DATABASE_URL_MIGRADOR:?Falta DATABASE_URL_MIGRADOR}

  app:
    image: ghcr.io/mogollo7/cpal:${VERSION:-pruebas}
    restart: always
    depends_on:
      db: { condition: service_healthy }
      migrar: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL}
      ENTORNO: ${ENTORNO:?Falta ENTORNO}
      AUTH_SECRET: ${AUTH_SECRET:?Falta AUTH_SECRET}
      CLAVE_CIFRADO: ${CLAVE_CIFRADO:?Falta CLAVE_CIFRADO}
      URL_SITIO: ${URL_SITIO:?Falta URL_SITIO}
      CRON_SECRET: ${CRON_SECRET:?Falta CRON_SECRET}
      SUPERUSUARIO_CORREO: ${SUPERUSUARIO_CORREO:-}
      RESEND_API_KEYS: ${RESEND_API_KEYS:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-}
      CORREO_RESPUESTA: ${CORREO_RESPUESTA:-}
      CORREO_REDIRIGIR_A: ${CORREO_REDIRIGIR_A:-}
      CORREO_MODO: ${CORREO_MODO:-consola}
      CAPL_DIRECCION: ${CAPL_DIRECCION:-}
      CAPL_TELEFONO: ${CAPL_TELEFONO:-}
      MEDICION: ${MEDICION:-no}
      RUTA_ARCHIVOS: /archivos
    volumes:
      - archivos:/archivos
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }
    mem_limit: 768m

  proxy:
    image: caddy:2-alpine
    restart: always
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en infra/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

volumes:
  datos_db:
  archivos:
  caddy_datos:
